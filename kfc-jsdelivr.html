<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Home</title>
<style>
  :root {
    --bg: #ffffff;
    --border: #ececee;
    --text: #1c1c1f;
    --muted: #6b6b73;
    --red: #e11d2e;
    --red-dark: #b91524;
    --red-soft: #fdecee;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: Inter, "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", sans-serif;
    background:
      radial-gradient(60rem 28rem at 50% -8rem, var(--red-soft), transparent 70%),
      var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 24px;
    overflow-x: hidden;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  a { color: inherit; text-decoration: none; }

  main { width: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 18vh; }

  .clock { text-align: center; margin-bottom: 38px; user-select: none; }
  .time { font-size: clamp(3.6rem, 11vw, 5.75rem); line-height: 1; font-weight: 600; letter-spacing: -0.035em; }
  .date {
    margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 10px;
    color: var(--muted); font-size: 0.95rem;
  }
  .date i { display: inline-block; width: 24px; height: 2px; border-radius: 2px; background: var(--red); }

  form.search {
    width: 100%; max-width: 650px; height: 58px;
    display: flex; align-items: center; gap: 12px;
    padding: 0 9px 0 22px;
    border: 1px solid var(--border);
    border-radius: 999px;
    background: #fff;
    box-shadow: 0 10px 30px -14px rgba(0,0,0,.2);
    transition: border-color .15s, box-shadow .15s;
  }
  form.search:focus-within {
    border-color: var(--red);
    box-shadow: 0 0 0 4px var(--red-soft), 0 10px 30px -14px rgba(0,0,0,.2);
  }
  form.search > svg { width: 18px; height: 18px; color: var(--muted); flex: none; }
  form.search input {
    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;
    font: inherit; font-size: 16px; color: var(--text);
  }
  form.search input::placeholder { color: var(--muted); }
  form.search button {
    flex: none; width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: var(--red); color: #fff; transition: background .15s;
  }
  form.search button:hover { background: var(--red-dark); }
  form.search button svg { width: 17px; height: 17px; }

  .quick { width: 100%; max-width: 640px; margin-top: 52px; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }
  .card {
    width: 92px; height: 98px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
    border: 1px solid transparent; border-radius: 16px;
    font-size: 0.82rem; font-weight: 500;
    transition: border-color .15s, background .15s, transform .15s;
  }
  .card:hover { border-color: var(--red); background: var(--red-soft); transform: translateY(-2px); }
  .badge {
    width: 44px; height: 44px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: #fff; border: 1px solid var(--border);
    font-weight: 600; color: var(--red);
    box-shadow: 0 4px 12px -6px rgba(0,0,0,.25);
  }
</style>
</head>
<body>
  <main>
    <div class="clock">
      <div class="time" id="time"></div>
      <div class="date"><i></i><span id="date"></span><i></i></div>
    </div>

    <form class="search" id="search" autocomplete="off">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      <input id="q" type="text" placeholder="Search the web or enter a URL" aria-label="Search" autofocus>
      <button type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
      </button>
    </form>

    <div class="quick" id="quick"></div>
  </main>

<script>
(function () {
  // Edit this list to change the shortcuts. Everything opens in the same tab.
  var QUICK = [
    { name: 'Google',    url: 'https://www.google.com' },
    { name: 'YouTube',   url: 'https://www.youtube.com' },
    { name: 'Wikipedia', url: 'https://www.wikipedia.org' },
    { name: 'GitHub',    url: 'https://github.com' }
  ];
  var ENGINE = 'https://www.google.com/search?q=';

  function go(url) {
    // Navigate the whole tab (works whether this runs standalone or inside the SVG wrapper).
    try { window.top.location.href = url; } catch (e) { window.location.href = url; }
  }

  var quick = document.getElementById('quick');
  QUICK.forEach(function (q) {
    var a = document.createElement('a');
    a.className = 'card';
    a.href = q.url;
    a.target = '_top';
    a.rel = 'noopener noreferrer';
    var b = document.createElement('div');
    b.className = 'badge';
    b.textContent = q.name.charAt(0);
    var n = document.createElement('div');
    n.textContent = q.name;
    a.appendChild(b);
    a.appendChild(n);
    quick.appendChild(a);
  });

  function tick() {
    var d = new Date(), h = d.getHours();
    var g = h < 5 ? 'Good evening' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening';
    document.getElementById('time').textContent = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    document.getElementById('date').textContent =
      g + ' · ' + d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
  }
  tick();
  setInterval(tick, 15000);

  document.getElementById('search').addEventListener('submit', function (e) {
    e.preventDefault();
    var v = document.getElementById('q').value.trim();
    if (!v) return;
    var hasScheme = /^https?:\/\//i.test(v);
    var looksLikeHost = /^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(v);
    if (hasScheme) go(v);
    else if (looksLikeHost) go('https://' + v);
    else go(ENGINE + encodeURIComponent(v));
  });
})();
</script>
</body>
</html>
