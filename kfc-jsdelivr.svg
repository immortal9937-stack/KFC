<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" style="position:fixed;left:0;top:0;width:100%;height:100%">
<title>Home</title>
<foreignObject x="0" y="0" width="100%" height="100%">
<iframe xmlns="http://www.w3.org/1999/xhtml" style="border:0;width:100%;height:100%;display:block" srcdoc="&lt;!DOCTYPE html&gt;&#10;&lt;html lang=&quot;en&quot;&gt;&#10;&lt;head&gt;&#10;&lt;meta charset=&quot;UTF-8&quot;&gt;&#10;&lt;meta name=&quot;viewport&quot; content=&quot;width=device-width, initial-scale=1&quot;&gt;&#10;&lt;title&gt;Home&lt;/title&gt;&#10;&lt;style&gt;&#10;  :root {&#10;    --bg: #ffffff;&#10;    --border: #ececee;&#10;    --text: #1c1c1f;&#10;    --muted: #6b6b73;&#10;    --red: #e11d2e;&#10;    --red-dark: #b91524;&#10;    --red-soft: #fdecee;&#10;  }&#10;  * { box-sizing: border-box; margin: 0; padding: 0; }&#10;  html, body { height: 100%; }&#10;  body {&#10;    font-family: Inter, &quot;Segoe UI&quot;, system-ui, -apple-system, Roboto, &quot;Helvetica Neue&quot;, sans-serif;&#10;    background:&#10;      radial-gradient(60rem 28rem at 50% -8rem, var(--red-soft), transparent 70%),&#10;      var(--bg);&#10;    color: var(--text);&#10;    -webkit-font-smoothing: antialiased;&#10;    display: flex;&#10;    flex-direction: column;&#10;    align-items: center;&#10;    padding: 0 24px;&#10;    overflow-x: hidden;&#10;  }&#10;  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }&#10;  a { color: inherit; text-decoration: none; }&#10;&#10;  main { width: 100%; display: flex; flex-direction: column; align-items: center; padding-top: 18vh; }&#10;&#10;  .clock { text-align: center; margin-bottom: 38px; user-select: none; }&#10;  .time { font-size: clamp(3.6rem, 11vw, 5.75rem); line-height: 1; font-weight: 600; letter-spacing: -0.035em; }&#10;  .date {&#10;    margin-top: 14px; display: flex; align-items: center; justify-content: center; gap: 10px;&#10;    color: var(--muted); font-size: 0.95rem;&#10;  }&#10;  .date i { display: inline-block; width: 24px; height: 2px; border-radius: 2px; background: var(--red); }&#10;&#10;  form.search {&#10;    width: 100%; max-width: 650px; height: 58px;&#10;    display: flex; align-items: center; gap: 12px;&#10;    padding: 0 9px 0 22px;&#10;    border: 1px solid var(--border);&#10;    border-radius: 999px;&#10;    background: #fff;&#10;    box-shadow: 0 10px 30px -14px rgba(0,0,0,.2);&#10;    transition: border-color .15s, box-shadow .15s;&#10;  }&#10;  form.search:focus-within {&#10;    border-color: var(--red);&#10;    box-shadow: 0 0 0 4px var(--red-soft), 0 10px 30px -14px rgba(0,0,0,.2);&#10;  }&#10;  form.search &gt; svg { width: 18px; height: 18px; color: var(--muted); flex: none; }&#10;  form.search input {&#10;    flex: 1; min-width: 0; border: 0; outline: 0; background: transparent;&#10;    font: inherit; font-size: 16px; color: var(--text);&#10;  }&#10;  form.search input::placeholder { color: var(--muted); }&#10;  form.search button {&#10;    flex: none; width: 40px; height: 40px; border-radius: 50%;&#10;    display: flex; align-items: center; justify-content: center;&#10;    background: var(--red); color: #fff; transition: background .15s;&#10;  }&#10;  form.search button:hover { background: var(--red-dark); }&#10;  form.search button svg { width: 17px; height: 17px; }&#10;&#10;  .quick { width: 100%; max-width: 640px; margin-top: 52px; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; }&#10;  .card {&#10;    width: 92px; height: 98px;&#10;    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;&#10;    border: 1px solid transparent; border-radius: 16px;&#10;    font-size: 0.82rem; font-weight: 500;&#10;    transition: border-color .15s, background .15s, transform .15s;&#10;  }&#10;  .card:hover { border-color: var(--red); background: var(--red-soft); transform: translateY(-2px); }&#10;  .badge {&#10;    width: 44px; height: 44px; border-radius: 50%;&#10;    display: flex; align-items: center; justify-content: center;&#10;    background: #fff; border: 1px solid var(--border);&#10;    font-weight: 600; color: var(--red);&#10;    box-shadow: 0 4px 12px -6px rgba(0,0,0,.25);&#10;  }&#10;&lt;/style&gt;&#10;&lt;/head&gt;&#10;&lt;body&gt;&#10;  &lt;main&gt;&#10;    &lt;div class=&quot;clock&quot;&gt;&#10;      &lt;div class=&quot;time&quot; id=&quot;time&quot;&gt;&lt;/div&gt;&#10;      &lt;div class=&quot;date&quot;&gt;&lt;i&gt;&lt;/i&gt;&lt;span id=&quot;date&quot;&gt;&lt;/span&gt;&lt;i&gt;&lt;/i&gt;&lt;/div&gt;&#10;    &lt;/div&gt;&#10;&#10;    &lt;form class=&quot;search&quot; id=&quot;search&quot; autocomplete=&quot;off&quot;&gt;&#10;      &lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.2&quot; stroke-linecap=&quot;round&quot;&gt;&lt;circle cx=&quot;11&quot; cy=&quot;11&quot; r=&quot;7&quot;/&gt;&lt;path d=&quot;M20 20l-4-4&quot;/&gt;&lt;/svg&gt;&#10;      &lt;input id=&quot;q&quot; type=&quot;text&quot; placeholder=&quot;Search the web or enter a URL&quot; aria-label=&quot;Search&quot; autofocus&gt;&#10;      &lt;button type=&quot;submit&quot; aria-label=&quot;Search&quot;&gt;&#10;        &lt;svg viewBox=&quot;0 0 24 24&quot; fill=&quot;none&quot; stroke=&quot;currentColor&quot; stroke-width=&quot;2.4&quot; stroke-linecap=&quot;round&quot;&gt;&lt;circle cx=&quot;11&quot; cy=&quot;11&quot; r=&quot;7&quot;/&gt;&lt;path d=&quot;M20 20l-4-4&quot;/&gt;&lt;/svg&gt;&#10;      &lt;/button&gt;&#10;    &lt;/form&gt;&#10;&#10;    &lt;div class=&quot;quick&quot; id=&quot;quick&quot;&gt;&lt;/div&gt;&#10;  &lt;/main&gt;&#10;&#10;&lt;script&gt;&#10;(function () {&#10;  // Edit this list to change the shortcuts. Everything opens in the same tab.&#10;  var QUICK = [&#10;    { name: 'Google',    url: 'https://www.google.com' },&#10;    { name: 'YouTube',   url: 'https://www.youtube.com' },&#10;    { name: 'Wikipedia', url: 'https://www.wikipedia.org' },&#10;    { name: 'GitHub',    url: 'https://github.com' }&#10;  ];&#10;  var ENGINE = 'https://www.google.com/search?q=';&#10;&#10;  function go(url) {&#10;    // Navigate the whole tab (works whether this runs standalone or inside the SVG wrapper).&#10;    try { window.top.location.href = url; } catch (e) { window.location.href = url; }&#10;  }&#10;&#10;  var quick = document.getElementById('quick');&#10;  QUICK.forEach(function (q) {&#10;    var a = document.createElement('a');&#10;    a.className = 'card';&#10;    a.href = q.url;&#10;    a.target = '_top';&#10;    a.rel = 'noopener noreferrer';&#10;    var b = document.createElement('div');&#10;    b.className = 'badge';&#10;    b.textContent = q.name.charAt(0);&#10;    var n = document.createElement('div');&#10;    n.textContent = q.name;&#10;    a.appendChild(b);&#10;    a.appendChild(n);&#10;    quick.appendChild(a);&#10;  });&#10;&#10;  function tick() {&#10;    var d = new Date(), h = d.getHours();&#10;    var g = h &lt; 5 ? 'Good evening' : h &lt; 12 ? 'Good morning' : h &lt; 18 ? 'Good afternoon' : 'Good evening';&#10;    document.getElementById('time').textContent = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });&#10;    document.getElementById('date').textContent =&#10;      g + ' · ' + d.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });&#10;  }&#10;  tick();&#10;  setInterval(tick, 15000);&#10;&#10;  document.getElementById('search').addEventListener('submit', function (e) {&#10;    e.preventDefault();&#10;    var v = document.getElementById('q').value.trim();&#10;    if (!v) return;&#10;    var hasScheme = /^https?:\/\//i.test(v);&#10;    var looksLikeHost = /^[\w-]+(\.[\w-]+)+(\/\S*)?$/.test(v);&#10;    if (hasScheme) go(v);&#10;    else if (looksLikeHost) go('https://' + v);&#10;    else go(ENGINE + encodeURIComponent(v));&#10;  });&#10;})();&#10;&lt;/script&gt;&#10;&lt;/body&gt;&#10;&lt;/html&gt;&#10;"></iframe>
</foreignObject>
</svg>
